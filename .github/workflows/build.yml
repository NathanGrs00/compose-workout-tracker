name: Build

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  android-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (incl. screenshot rendering)
        run: ./gradlew :composeApp:desktopTest --stacktrace
      - name: Build Android APK
        run: ./gradlew :composeApp:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: repvane-android
          path: composeApp/build/outputs/apk/release/*.apk
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: composeApp/build/screenshots/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI installer
        run: ./gradlew :composeApp:packageMsi --stacktrace
      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: repvane-windows
          path: composeApp/build/compose/binaries/main/msi/*.msi

  # Publishes a GitHub Release named after versionName (e.g. v1.1.0) with the APK and the Windows installer.
  # Runs on pushes to master and when started manually (Actions -> Build -> Run workflow).
  # Skipped if a release for that version already exists, so bump versionName for each new release.
  release:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [android-and-tests, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' composeApp/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, skipping. Bump versionName to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.exists == 'false'
        with:
          path: artifacts
      - name: Name the release files
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir release
          cp artifacts/repvane-android/*.apk release/Repvane.apk
          cp artifacts/repvane-windows/*.msi "release/Repvane-${{ steps.version.outputs.version }}.msi"
          ls -l release
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Repvane ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release/*
